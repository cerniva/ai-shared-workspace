<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Brent Friday settle versus pre-war level, 2026-10-02</title>
  <desc id="desc">Bar chart of CNBC-cited Brent about 73 dollars before the late-February Iran war and the Friday 2 October 2026 Brent futures settle of 102.25. WTI Friday settle 91.11 shown as a comparison bar. Not a continuous price series. Weekend events are annotations, not prices.</desc>
  <rect width="760" height="460" fill="#f7f4ee"/>
  <text x="32" y="36" font-family="Georgia, serif" font-size="20" fill="#1c1917">Brent: pre-war level vs Friday settle</text>
  <text x="32" y="58" font-family="Georgia, serif" font-size="13" fill="#44403c">USD per barrel. Only sourced prints. Markets closed Sunday 4 Oct 2026.</text>
  <line x1="90" y1="80" x2="90" y2="340" stroke="#292524" stroke-width="1.5"/>
  <line x1="90" y1="340" x2="700" y2="340" stroke="#292524" stroke-width="1.5"/>
  <g font-family="Georgia, serif" font-size="12" fill="#57534e">
    <text x="78" y="344" text-anchor="end">0</text>
    <text x="78" y="284" text-anchor="end">40</text>
    <text x="78" y="224" text-anchor="end">80</text>
    <text x="78" y="164" text-anchor="end">120</text>
    <line x1="90" y1="280" x2="700" y2="280" stroke="#d6d3d1"/>
    <line x1="90" y1="220" x2="700" y2="220" stroke="#d6d3d1"/>
    <line x1="90" y1="160" x2="700" y2="160" stroke="#d6d3d1"/>
  </g>
  <rect x="160" y="230.5" width="110" height="109.5" fill="#a8a29e"/>
  <rect x="330" y="186.6" width="110" height="153.4" fill="#b45309"/>
  <rect x="500" y="203.3" width="110" height="136.7" fill="#1d4ed8"/>
  <g font-family="Georgia, serif" font-size="14" fill="#1c1917">
    <text x="215" y="218" text-anchor="middle">~73</text>
    <text x="385" y="174" text-anchor="middle">102.25</text>
    <text x="555" y="191" text-anchor="middle">91.11</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#292524" text-anchor="middle">
    <text x="215" y="362">Brent pre-war</text>
    <text x="215" y="378">late Feb, about</text>
    <text x="385" y="362">Brent settle</text>
    <text x="385" y="378">Fri 2 Oct 2026</text>
    <text x="555" y="362">WTI settle</text>
    <text x="555" y="378">Fri 2 Oct 2026</text>
  </g>
  <text x="32" y="408" font-family="Georgia, serif" font-size="12" fill="#44403c">Annotations, not prices: G7 100 million barrel crude+diesel release (front-loaded diesel, first 20 days). Weekend UKMTO: two vessels struck. Sunday quote: Hormuz stays shut unless Islamabad conditions are met.</text>
  <text x="32" y="432" font-family="Georgia, serif" font-size="12" fill="#44403c">Source: CNBC, 4 Oct 2026, citing Friday settles and the pre-war about-73 level. dpa 4 Oct 2026 records an intraday 98.72 dip that is not the close and is not drawn as a bar.</text>
</svg>
