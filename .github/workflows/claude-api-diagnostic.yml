name: Claude API Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-api-diagnostic.yml'
      - 'state/claude-api-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect Claude key shape safely
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          key = os.environ.get('ANTHROPIC_API_KEY','')
          print('key_present=' + str(bool(key)))
          print('key_length=' + str(len(key)))
          print('starts_with_sk_ant=' + str(key.startswith('sk-ant-')))
          print('has_leading_or_trailing_whitespace=' + str(key != key.strip()))
          print('contains_internal_whitespace=' + str(any(ch.isspace() for ch in key.strip())))
          print('looks_wrapped_in_quotes=' + str((len(key) >= 2) and key[0] in "\"'" and key[-1] == key[0]))
          PY
      - name: Probe key with Authorization bearer
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          req = Request(
              'https://api.anthropic.com/v1/messages',
              data=json.dumps({
                  'model':'claude-opus-5-5',
                  'max_tokens':1,
                  'messages':[{'role':'user','content':'ping'}],
              }).encode('utf-8'),
              headers={
                  'Authorization':'Bearer ' + os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version':'2023-06-01',
                  'content-type':'application/json',
              },
              method='POST',
          )
          try:
              with urlopen(req, timeout=30) as response:
                  print('bearer_probe_status=' + str(response.status))
          except HTTPError as exc:
              body = exc.read().decode('utf-8','replace')
              print(f'bearer_probe HTTP {exc.code}: {body}')
          PY
      - name: List accessible non-default Anthropic workspaces
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          req = Request(
              'https://api.anthropic.com/v1/organizations/workspaces?limit=100',
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
              },
          )
          try:
              with urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except HTTPError as exc:
              body = exc.read().decode('utf-8', 'replace')
              print(f'workspace-list HTTP {exc.code}: {body}')
              raise SystemExit(0)

          workspaces = data.get('data') or []
          print(f'non_default_workspace_count={len(workspaces)}')
          for ws in workspaces:
              print('workspace', ws.get('id'), ws.get('name'), 'archived=' + str(bool(ws.get('archived_at'))))
          PY
      - name: Probe Claude API
        shell: bash
        env:
          BROWSER_OBJECTIVE: 'Return an empty browser task with id ai-browser and steps array.'
          BROWSER_PLANNER_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_MODEL: claude-opus-5-5
        run: |
          set +e
          python browser_worker/ai_planner.py >/tmp/claude-task.json 2>/tmp/claude-error.txt
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo 'Claude diagnostic failed:'
            cat /tmp/claude-error.txt
            exit "$rc"
          fi
          echo 'Claude diagnostic succeeded:'
          python -m json.tool /tmp/claude-task.json
