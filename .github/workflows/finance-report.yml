name: finance-report

# Hourly + on-demand + event-triggered finance report -> messages/finance-report-latest.md
# Keyless public sources only. Optional LLM summary via scripts/model_fallback.py is OFF
# unless repo variable FINANCE_REPORT_LLM == '1'; deterministic report otherwise.
# Event trigger example:
#   gh api repos/OWNER/REPO/dispatches -f event_type=finance-event -f client_payload[reason]=fomc

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [finance-event, finance-report]

concurrency:
  group: ${{ github.ref_name == 'main' && 'repo-main-writers' || format('finance-report-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINANCE_REPORT_LLM: ${{ vars.FINANCE_REPORT_LLM || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest tests.test_finance_report tests.test_finance_repair -v
      - name: Build report
        run: |
          echo "trigger=${{ github.event_name }} reason=${{ github.event.client_payload.reason || '-' }}"
          python scripts/finance_report.py > /dev/null
          head -40 messages/finance-report-latest.md
      - name: Commit report only
        shell: bash
        run: |
          git add messages/finance-report-latest.md
          if git diff --cached --name-only | grep -vx 'messages/finance-report-latest.md'; then
            echo 'unexpected staged path'; exit 1
          fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "finance-report-bot"
          git config user.email "finance-report-bot@users.noreply.github.com"
          git commit -m "finance-report: update ${{ github.event_name }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
