name: AI Browser Worker
on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Tell the AI what to do in the browser"
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: grok-4.7
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      BROWSER_OBJECTIVE: ${{ inputs.objective }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r browser_worker/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: AI plans browser actions
        shell: bash
        run: |
          if ! python browser_worker/ai_planner.py > task.json; then
            echo "AI providers unavailable; using local fallback planner" >&2
            python browser_worker/local_planner.py > task.json
          fi
      - name: Validate generated task
        run: python -m json.tool task.json
      - name: Execute browser actions
        run: python browser_worker/worker.py task.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-worker-${{ github.run_id }}
          path: |
            browser-artifacts/
            task.json
          if-no-files-found: ignore
