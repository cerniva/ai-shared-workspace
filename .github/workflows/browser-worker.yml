name: AI Browser Worker
on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Tell the AI what to do in the browser"
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      BROWSER_OBJECTIVE: ${{ inputs.objective }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r browser_worker/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: AI plans browser actions
        run: python browser_worker/ai_planner.py > task.json
      - name: Validate generated task
        run: python -m json.tool task.json
      - name: Execute browser actions
        run: python browser_worker/worker.py task.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-worker-${{ github.run_id }}
          path: |
            browser-artifacts/
            task.json
          if-no-files-found: ignore
