name: AI Browser Worker

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Tell the AI what to do in the browser"
        required: true
        type: string
      allowed_hosts:
        description: "Comma-separated hostnames this run may visit (for example, example.com)"
        required: true
        default: "example.com"
        type: string
      execution_mode:
        description: "Read-only by default; interactive enables named low-impact clicks and fills"
        required: true
        default: "read_only"
        type: choice
        options:
          - read_only
          - interactive
      browser_engine:
        description: "Browser execution engine"
        required: true
        default: "playwright"
        type: choice
        options:
          - playwright
          - skyvern
      planner_provider:
        description: "Choose which AI plans the browser steps"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - openai
          - grok
          - gemini
          - claude

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_OBJECTIVE: ${{ inputs.objective }}
      BROWSER_ALLOWED_HOSTS: ${{ inputs.allowed_hosts }}
      BROWSER_EXECUTION_MODE: ${{ inputs.execution_mode }}
      BROWSER_ENGINE: ${{ inputs.browser_engine }}
      BROWSER_PLANNER_PROVIDER: ${{ inputs.planner_provider }}
      SKYVERN_API_KEY: ${{ secrets.SKYVERN_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: AI plans browser actions
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.7
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-5-5
        run: |
          if ! python browser_worker/ai_planner.py > task.json; then
            echo "AI providers unavailable; using local fallback planner" >&2
            python browser_worker/local_planner.py > task.json
          fi
      - name: Validate generated task
        run: python -m json.tool task.json
      - run: pip install -r browser_worker/requirements.txt
      - name: Validate browser engine
        run: python -c "from browser_worker.engine_router import choose_engine; print(choose_engine({}))"
      - name: Install Chromium for Playwright
        if: ${{ env.BROWSER_ENGINE == 'playwright' }}
        run: python -m playwright install --with-deps chromium
      - name: Execute browser actions
        shell: bash
        run: |
          if [ "$BROWSER_ENGINE" = "skyvern" ]; then
            python browser_worker/skyvern_worker.py task.json
          else
            python browser_worker/worker.py task.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-worker-${{ github.run_id }}
          path: |
            browser-artifacts/
            task.json
          if-no-files-found: ignore
