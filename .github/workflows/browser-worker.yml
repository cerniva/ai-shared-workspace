name: AI Browser Worker
on:
  push:
    branches: [main]
    paths:
      - 'state/claude-auth-retry.txt'
  workflow_dispatch:
    inputs:
      objective:
        description: "Tell the AI what to do in the browser"
        required: true
        type: string
      allowed_hosts:
        description: "Comma-separated hostnames this run may visit (for example, example.com)"
        required: true
        default: "example.com"
        type: string
      execution_mode:
        description: "Read-only by default; interactive enables named low-impact clicks and fills"
        required: true
        default: "read_only"
        type: choice
        options:
          - read_only
          - interactive
      planner_provider:
        description: "Choose which AI plans the browser steps"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - openai
          - grok
          - gemini
          - claude
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_OBJECTIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.objective || 'Go to https://example.com and extract the page title' }}
      BROWSER_ALLOWED_HOSTS: ${{ github.event_name == 'workflow_dispatch' && inputs.allowed_hosts || 'example.com' }}
      BROWSER_EXECUTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode || 'read_only' }}
      BROWSER_PLANNER_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.planner_provider || 'claude' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe Claude auth configuration
        shell: bash
        env:
          A1: ${{ secrets.ANTHROPIC_API_KEY }}
          A2: ${{ secrets.CLAUDE_API_KEY }}
          A3: ${{ secrets.ANTHROPIC_KEY }}
          A4: ${{ secrets.CLAUDE_KEY }}
          A5: ${{ secrets.ANTHROPIC_API }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WIF_RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          WIF_ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          for name in A1 A2 A3 A4 A5 OAUTH; do
            if [ -n "${!name}" ]; then echo "$name=SET"; else echo "$name=UNSET"; fi
          done
          if [ -n "$WIF_RULE" ] && [ -n "$WIF_ORG" ]; then echo "WIF=CONFIGURED"; else echo "WIF=UNCONFIGURED"; fi
      - run: pip install -r browser_worker/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: AI plans browser actions
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.7
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_KEY || secrets.ANTHROPIC_API }}
          ANTHROPIC_MODEL: claude-opus-5-5
        run: |
          if ! python browser_worker/ai_planner.py > task.json; then
            echo "AI providers unavailable; using local fallback planner" >&2
            python browser_worker/local_planner.py > task.json
          fi
      - name: Validate generated task
        run: python -m json.tool task.json
      - name: Execute browser actions
        run: python browser_worker/worker.py task.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-browser-worker-${{ github.run_id }}
          path: |
            browser-artifacts/
            task.json
          if-no-files-found: ignore
