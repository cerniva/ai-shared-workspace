name: desk-notify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "messages/**"
      - "scripts/desk_bridge.py"
      - "scripts/desk_health_normalize.py"
      - "scripts/desk_notify_commit.py"
      - "state/inbox_read.json"
      - ".github/workflows/desk-notify.yml"

concurrency:
  group: repo-main-writers
  queue: max

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile desk notification ledger
        id: reconcile
        continue-on-error: true
        run: python3 scripts/desk_bridge.py reconcile
      - name: Normalize live desk health metadata
        id: normalize
        if: always()
        continue-on-error: true
        run: python3 scripts/desk_health_normalize.py
      - name: Commit ledger delta
        if: always()
        run: python3 scripts/desk_notify_commit.py
      - name: Fail closed when reconciliation failed
        if: steps.reconcile.outcome == 'failure' || steps.normalize.outcome == 'failure'
        run: exit 1
