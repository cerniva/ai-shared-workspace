name: desk-notify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "messages/**"
      - "scripts/desk_bridge.py"
      - "state/inbox_read.json"
      - ".github/workflows/desk-notify.yml"

concurrency:
  group: repo-main-writers
  queue: max

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile desk notification ledger
        id: reconcile
        continue-on-error: true
        run: python3 scripts/desk_bridge.py reconcile
      - name: Commit ledger delta
        if: always()
        run: |
          git config user.name "desk-notify-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/message_delivery.json state/desk_notify_health.json state/inbox_read.json
          git diff --cached --quiet && exit 0
          git commit -m "desk-notify: persist delivery ledger"
          git pull --rebase origin main
          git push
      - name: Fail closed when reconcile failed
        if: steps.reconcile.outcome == 'failure'
        run: exit 1
