name: worker-orchestration-tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/work_queue.py'
      - 'scripts/knowledge_bridge.py'
      - 'scripts/learning_bridge.py'
      - 'knowledge/learning_ledger.json'
      - 'knowledge/knowledge_index.json'
      - 'knowledge/source_catalog.json'
      - 'knowledge/RESEARCH_ROUTER.md'
      - 'state/now.json'
      - 'state/cross_chat_sync.json'
      - 'tasks/active.json'
      - 'scripts/worker_adapters.py'
      - 'scripts/worker_runner.py'
      - 'scripts/observability.py'
      - 'scripts/requirements-observability.txt'
      - 'scripts/review_gate.py'
      - 'scripts/provider_config.py'
      - 'scripts/run_worker.py'
      - 'scripts/run_next_worker.py'
      - 'scripts/worker_health.py'
      - 'scripts/shorts_mp4_qc.py'
      - 'scripts/auto_merge_gate.py'
      - 'config/auto_merge.json'
      - 'scripts/team_worker.py'
      - 'scripts/team_research.py'
      - 'scripts/model_fallback.py'
      - 'scripts/provider_health.py'
      - 'config/model_providers.json'
      - 'state/handoffs.json'
      - 'browser_worker/**'
      - 'orchestrator/**'
      - 'research_worker/**'
      - 'shorts_worker/**'
      - 'shopify_worker/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'scripts/knowledge_promote.py'
      - 'tests/test_knowledge_*'
      - '.github/workflows/worker-orchestration-tests.yml'
  pull_request:
    paths:
      - 'scripts/work_queue.py'
      - 'scripts/knowledge_bridge.py'
      - 'scripts/learning_bridge.py'
      - 'knowledge/learning_ledger.json'
      - 'knowledge/knowledge_index.json'
      - 'knowledge/source_catalog.json'
      - 'knowledge/RESEARCH_ROUTER.md'
      - 'state/now.json'
      - 'state/cross_chat_sync.json'
      - 'tasks/active.json'
      - 'scripts/worker_adapters.py'
      - 'scripts/worker_runner.py'
      - 'scripts/observability.py'
      - 'scripts/requirements-observability.txt'
      - 'scripts/review_gate.py'
      - 'scripts/provider_config.py'
      - 'scripts/run_worker.py'
      - 'scripts/run_next_worker.py'
      - 'scripts/worker_health.py'
      - 'scripts/shorts_mp4_qc.py'
      - 'scripts/auto_merge_gate.py'
      - 'config/auto_merge.json'
      - 'scripts/team_worker.py'
      - 'scripts/team_research.py'
      - 'scripts/model_fallback.py'
      - 'scripts/provider_health.py'
      - 'config/model_providers.json'
      - 'state/handoffs.json'
      - 'browser_worker/**'
      - 'orchestrator/**'
      - 'research_worker/**'
      - 'shorts_worker/**'
      - 'shopify_worker/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'scripts/knowledge_promote.py'
      - 'tests/test_knowledge_*'
      - '.github/workflows/worker-orchestration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ffmpeg (MP4 QC tests need real media tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Shorts MP4 QC tests (HO-20261010-12)
        run: python3 -m unittest tests.test_shorts_mp4_qc -v
      - name: team-worker tests
        run: python3 -m unittest tests.test_team_worker -v
      - name: Auto-merge gate tests
        run: python3 -m unittest tests.test_auto_merge_gate -v
      - name: provider-health + model fallback tests
        run: python3 -m unittest tests.test_provider_health tests.test_backup_supervisor -v
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Knowledge integrity and race tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest tests.test_knowledge_integrity tests.test_knowledge_race -v
      - name: Fail-closed persistence gate
        run: python3 scripts/learning_bridge.py gate FAIL_CLOSED_PERSISTENCE_GATE
      - name: Compile check
        run: find scripts tests browser_worker orchestrator research_worker shorts_worker shopify_worker -name '*.py' ! -name 'desk_bridge_part1.py' ! -name 'desk_bridge_part2.py' -print0 | xargs -0 python3 -m py_compile
      - name: Secret-pattern guard
        shell: bash
        run: |
          # Boundary required: task-update subject slugs end in "sk" + "-update.." and are not keys.
          if grep -RInE '(^|[^A-Za-z0-9])(xai-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,})' scripts tests state browser_worker orchestrator research_worker shorts_worker shopify_worker; then
            echo 'Potential committed secret pattern detected'
            exit 1
          fi
