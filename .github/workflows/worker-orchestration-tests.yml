name: worker-orchestration-tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/work_queue.py'
      - 'scripts/knowledge_bridge.py'
      - 'scripts/learning_bridge.py'
      - 'knowledge/learning_ledger.json'
      - 'knowledge/knowledge_index.json'
      - 'knowledge/source_catalog.json'
      - 'knowledge/RESEARCH_ROUTER.md'
      - 'scripts/worker_adapters.py'
      - 'scripts/worker_runner.py'
      - 'scripts/review_gate.py'
      - 'scripts/provider_config.py'
      - 'scripts/run_worker.py'
      - 'scripts/run_next_worker.py'
      - 'scripts/worker_health.py'
      - 'browser_worker/**'
      - 'orchestrator/**'
      - 'research_worker/**'
      - 'shorts_worker/**'
      - 'shopify_worker/**'
      - 'hercules_sentinel/**'
      - 'config/hercules_sentinel.json'
      - '.github/workflows/**'
      - 'tests/**'
      - '.github/workflows/worker-orchestration-tests.yml'
  pull_request:
    paths:
      - 'scripts/work_queue.py'
      - 'scripts/knowledge_bridge.py'
      - 'scripts/learning_bridge.py'
      - 'knowledge/learning_ledger.json'
      - 'knowledge/knowledge_index.json'
      - 'knowledge/source_catalog.json'
      - 'knowledge/RESEARCH_ROUTER.md'
      - 'scripts/worker_adapters.py'
      - 'scripts/worker_runner.py'
      - 'scripts/review_gate.py'
      - 'scripts/provider_config.py'
      - 'scripts/run_worker.py'
      - 'scripts/run_next_worker.py'
      - 'scripts/worker_health.py'
      - 'browser_worker/**'
      - 'orchestrator/**'
      - 'research_worker/**'
      - 'shorts_worker/**'
      - 'shopify_worker/**'
      - 'hercules_sentinel/**'
      - 'config/hercules_sentinel.json'
      - '.github/workflows/**'
      - 'tests/**'
      - '.github/workflows/worker-orchestration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile check
        run: find scripts tests browser_worker orchestrator research_worker shorts_worker shopify_worker hercules_sentinel -name '*.py' ! -name 'desk_bridge_part1.py' ! -name 'desk_bridge_part2.py' -print0 | xargs -0 python3 -m py_compile
      - name: Secret-pattern guard
        shell: bash
        run: |
          if grep -RInE '(xai-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,})' scripts tests state browser_worker orchestrator research_worker shorts_worker shopify_worker hercules_sentinel config/hercules_sentinel.json; then
            echo 'Potential committed secret pattern detected'
            exit 1
          fi
