name: Research Router RED
on:
  push:
    branches: ['test/research-router-red']
  workflow_dispatch:
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_research_router -v
