name: shorts-render-tests

on:
  pull_request:
    paths:
      - 'scripts/shorts_*.py'
      - 'tests/test_shorts_*.py'
      - '.github/workflows/shorts-*.yml'
      - '.github/workflows/youtube-upload.yml'
      - 'research/youtube/SHORTS_SOP.md'
      - 'knowledge/shorts/RESEARCH_MODULE.md'
  push:
    branches: [main]
    paths:
      - 'scripts/shorts_*.py'
      - 'tests/test_shorts_*.py'
      - '.github/workflows/shorts-*.yml'
      - '.github/workflows/youtube-upload.yml'
      - 'research/youtube/SHORTS_SOP.md'
      - 'knowledge/shorts/RESEARCH_MODULE.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, eSpeak NG and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python3 -m pip install --disable-pip-version-check pytest
      - name: Renderer and workflow tests
        run: >-
          python3 -m unittest
          tests.test_shorts_render
          tests.test_shorts_render_tts
          tests.test_shorts_free_render_workflow
          tests.test_youtube_upload_workflow
          tests.test_shorts_media
          tests.test_shorts_research_free_render
          tests.test_shorts_free_pipeline
          tests.test_shorts_free_build_workflow
          tests.test_shorts_sop_policy
          -v
      - name: Full Python suite
        run: python3 -m pytest -q
      - name: Compile Shorts modules
        run: python3 -m py_compile scripts/shorts_render.py scripts/shorts_media.py scripts/shorts_research.py scripts/shorts_free_pipeline.py
