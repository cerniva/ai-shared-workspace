name: shorts-render-tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/shorts_*.py'
      - 'tests/test_shorts_*.py'
      - '.github/workflows/shorts-*.yml'
      - '.github/workflows/youtube-upload.yml'
      - 'research/youtube/SHORTS_SOP.md'
      - 'knowledge/shorts/RESEARCH_MODULE.md'
  push:
    branches: [main]
    paths:
      - 'scripts/shorts_*.py'
      - 'tests/test_shorts_*.py'
      - '.github/workflows/shorts-*.yml'
      - '.github/workflows/youtube-upload.yml'
      - 'research/youtube/SHORTS_SOP.md'
      - 'knowledge/shorts/RESEARCH_MODULE.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install only missing free test dependencies
        run: |
          # Hosted runners often have FFmpeg already; downloading its full apt
          # dependency tree previously exceeded the 8-minute install step.
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v espeak-ng >/dev/null 2>&1 || missing+=(espeak-ng)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          python3 -m pip show pytest >/dev/null 2>&1 || python3 -m pip install --disable-pip-version-check pytest
          ffmpeg -version | head -n 1
          espeak-ng --version
          python3 -m pytest --version
      - name: Renderer and workflow tests
        run: >-
          python3 -m unittest
          tests.test_shorts_render
          tests.test_shorts_render_tts
          tests.test_shorts_free_render_workflow
          tests.test_youtube_upload_workflow
          tests.test_shorts_media
          tests.test_shorts_research_free_render
          tests.test_shorts_free_pipeline
          tests.test_shorts_free_build_workflow
          tests.test_shorts_sop_policy
          tests.test_shorts_mp4_qc
          -v
      - name: Full Python suite
        run: python3 -m pytest -q
      - name: Compile Shorts modules
        run: python3 -m py_compile scripts/shorts_render.py scripts/shorts_media.py scripts/shorts_research.py scripts/shorts_free_pipeline.py
