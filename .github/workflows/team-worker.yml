name: team-worker

# Event-triggered handoff worker. PR-only: works on bot/<handoff_id>-<run_id>,
# never pushes main, never dispatches publish/payment workflows (see
# scripts/team_worker.py DENYLIST). YAPAMADIM -> repository_dispatch team-research.
on:
  repository_dispatch:
    types: [team-work]
  workflow_dispatch:
    inputs:
      handoff_id:
        description: 'Handoff id (state/handoffs.json)'
        required: true
      dry_run:
        description: 'Dry run: no push, no PR, no dispatch'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'state/handoffs.json'
      - 'state/team_worker_queue.json'
  # After provider-health finishes, retry the oldest CannotDo-queued job (if a model is back).
  workflow_run:
    workflows: [provider-health]
    types: [completed]

concurrency:
  group: team-worker-${{ github.event.client_payload.handoff_id || inputs.handoff_id || 'handoffs-push' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read
  checks: read

jobs:
  work:
    # Commits by this bot land only on bot/* branches, so push events from them never reach here.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # up to 2x20 min waiting on PR head checks (team-pr-opened, then re-send once CI finishes)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Shared model chain: scripts.model_fallback.fallback_adapter (config/model_providers.json); GitHub Models uses GITHUB_TOKEN + models: read.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ffmpeg (full test suite includes MP4 QC tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run team-worker
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python3 -m scripts.team_worker "${args[@]}"
