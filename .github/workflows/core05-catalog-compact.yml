name: core05-catalog-compact

on:
  push:
    branches: [fix/core05-verification-debt]
    paths:
      - '.github/workflows/core05-catalog-compact.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compact catalog without semantic changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('knowledge/source_catalog.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 -m scripts.knowledge_bridge validate
      - name: Persist compact catalog
        shell: bash
        run: |
          if git diff --quiet -- knowledge/source_catalog.json; then
            exit 0
          fi
          git config user.name "ai-worker-bot"
          git config user.email "ai-worker-bot@users.noreply.github.com"
          git add knowledge/source_catalog.json
          git commit -m "chore: preserve compact source catalog format"
          git push origin HEAD:fix/core05-verification-debt
