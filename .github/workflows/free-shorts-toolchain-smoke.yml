name: Free Shorts Toolchain Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-shorts-toolchain-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test headless browser without third-party accounts
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("data:text/html,<title>smoke</title><h1>ready</h1>")
              assert page.locator("h1").inner_text() == "ready"
              browser.close()
          print("PLAYWRIGHT_SMOKE_PASS")
          PY
      - name: Test local video encoding
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=360x640:rate=15 -t 2 -c:v libx264 -pix_fmt yuv420p -y /tmp/shorts-smoke.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 /tmp/shorts-smoke.mp4 | grep -qx '360,640'
          echo FFMPEG_SMOKE_PASS
