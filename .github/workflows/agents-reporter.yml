name: agents-reporter

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

concurrency:
  group: repo-main-writers
  queue: max

permissions:
  contents: write
  actions: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run agent (model step skipped cleanly if no provider key)
        run: python3 -m scripts.github_agents reporter
      - name: Append provider health summary (read-only)
        run: python3 -m scripts.provider_health --append-report messages/agents-report-latest.md messages/chatgpt-to-read.md
      - name: Persist agent output only
        shell: bash
        run: |
          git add -A -- state/agents_history.json messages/agents-report-latest.md messages/chatgpt-to-read.md 2>/dev/null || true
          # Guard: agent output may only land in these paths (never .github/, PayoutLens or code).
          if git diff --cached --name-only | grep -vE '^(state/agents_history\.json|messages/agents-report-latest\.md|messages/chatgpt-to-read\.md)$'; then
            echo 'unexpected staged path'; exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "agents-reporter-bot"
          git config user.email "agents-reporter-bot@users.noreply.github.com"
          git commit -m "agents-reporter: agent output"
          git pull --rebase origin main
          git push origin HEAD:main
