name: shorts-48h-lessons

# Every 6h: for each upload in knowledge/shorts/upload_ledger.json that is >=48h old
# and has no lesson yet, fetch its YouTube Analytics metrics (read-only) and append
# a lesson to knowledge/shorts/learnings/video-lessons.md. Never uploads/publishes.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-48h-lessons
  cancel-in-progress: false

jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check due items
        id: due
        run: |
          out=$(python3 scripts/shorts_lesson_48h.py due)
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$out" | grep -q '"due": \[\]'; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        if: steps.due.outputs.any == 'true'
        with:
          python-version: "3.12"
      - name: Fetch metrics and append lessons
        if: steps.due.outputs.any == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install -q -r scripts/requirements-youtube.txt
          python scripts/shorts_lesson_48h.py run | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit lessons and ledger
        if: steps.due.outputs.any == 'true'
        run: |
          git add knowledge/shorts/upload_ledger.json knowledge/shorts/learnings
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "shorts-lessons-bot"
          git config user.email "shorts-lessons-bot@users.noreply.github.com"
          git commit -m "shorts: 48h video lessons (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
