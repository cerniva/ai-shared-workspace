name: lesson-learner

on:
  pull_request:
    types: [closed]
    branches: [main]
  # auto-merge-gate merges with GITHUB_TOKEN (no pull_request/push events) and
  # sends repository_dispatch main-merged {pr_number, merge_sha, handoff_id}.
  repository_dispatch:
    types: [main-merged]
  # Backlog retry after provider-health (hourly cron). workflow_run is generated by
  # GitHub on the provider-health run's completion, so it fires for its cron runs too.
  workflow_run:
    workflows: ["provider-health"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number (empty = backlog mode: retry YAPAMADIM PRs, max 3)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lesson-learner-${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number || 'backlog' }}
  cancel-in-progress: false

jobs:
  learn:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'bot/lessons-pr-')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'main-merged') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Draft lesson (branch bot/lessons-pr-N + PR; never pushes main)
        run: |
          git config user.name "lesson-learner[bot]"
          git config user.email "lesson-learner@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$PR_NUMBER" ]; }; then
            python3 -m scripts.lesson_learner --backlog
          else
            python3 -m scripts.lesson_learner --pr "$PR_NUMBER" --dispatch-payload "$DISPATCH_PAYLOAD"
          fi
