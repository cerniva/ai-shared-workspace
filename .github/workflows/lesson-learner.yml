name: lesson-learner

on:
  pull_request:
    types: [closed]
    branches: [main]
  # auto-merge-gate merges with GITHUB_TOKEN (no pull_request/push events) and
  # sends repository_dispatch main-merged {pr_number, merge_sha, handoff_id}.
  repository_dispatch:
    types: [main-merged]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number (optional; empty = no-op)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lesson-learner-${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  learn:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'lessons/')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'main-merged') ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Draft lesson (branch lessons/pr-N + PR; never pushes main)
        run: |
          git config user.name "lesson-learner[bot]"
          git config user.email "lesson-learner@users.noreply.github.com"
          python3 -m scripts.lesson_learner --pr "$PR_NUMBER" --dispatch-payload "$DISPATCH_PAYLOAD"
