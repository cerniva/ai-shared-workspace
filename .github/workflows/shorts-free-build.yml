name: shorts-free-build

on:
  workflow_dispatch:
    inputs:
      packet_path:
        description: Repository-relative approved Shorts research packet
        required: true
        type: string
      output_name:
        description: MP4 artifact filename
        required: false
        default: short.mp4
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install local media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          # Free, keyless neural TTS; renderer falls back to espeak-ng if this fails.
          python3 -m pip install --user --break-system-packages "edge-tts>=7,<8" \
            || echo "edge-tts install failed; espeak-ng fallback"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate inputs
        env:
          PACKET: ${{ inputs.packet_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path.cwd().resolve()
          packet = Path(os.environ["PACKET"])
          if packet.is_absolute() or ".." in packet.parts:
              raise SystemExit("packet_path must be repository-relative")
          resolved = (root / packet).resolve()
          if root not in resolved.parents or not resolved.is_file():
              raise SystemExit("packet_path must point to an existing repository file")
          if resolved.suffix.lower() != ".json":
              raise SystemExit("packet_path must point to a JSON file")

          output_name = os.environ["OUTPUT_NAME"]
          if output_name.startswith(".") or not re.fullmatch(
              r"[A-Za-z0-9._-]{1,120}\.mp4", output_name, re.IGNORECASE
          ):
              raise SystemExit("output_name must be a visible simple .mp4 filename")
          PY

      - name: Load plan learnings
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/plan_learnings.py video_shopify --require --out artifacts/plan_learnings.json

      - name: Acquire free media and render
        env:
          PACKET: ${{ inputs.packet_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          SHORTS_TTS_ENGINE: edge-tts
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/bundle
          python3 scripts/shorts_free_pipeline.py "$PACKET" artifacts/bundle "artifacts/$OUTPUT_NAME" --learnings artifacts/plan_learnings.json

      - name: Run technical preflight
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set +e
          python3 scripts/shorts_preflight.py "artifacts/$OUTPUT_NAME" > artifacts/preflight.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/preflight.json").read_text(encoding="utf-8"))
          blockers = [
              item for item in report.get("blockers", [])
              if item != "independent_review_missing"
          ]
          if blockers:
              raise SystemExit("technical preflight failed: " + ",".join(blockers))
          print("Technical preflight passed; independent review is still required before publishing.")
          PY

      - name: Upload free build bundle
        uses: actions/upload-artifact@v7
        with:
          name: shorts-free-build
          path: |
            artifacts/${{ inputs.output_name }}
            artifacts/preflight.json
            artifacts/plan_learnings.json
            artifacts/bundle/provenance.json
            artifacts/bundle/captions.srt
            artifacts/bundle/render.json
          if-no-files-found: error
          retention-days: 7
