name: meta-senses

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - messages/inbox-meta.md

concurrency:
  group: meta-senses
  cancel-in-progress: false

jobs:
  run-meta:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check queued
        id: pending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path("messages/inbox-meta.md")
          text = path.read_text(encoding="utf-8") if path.exists() else ""
          latest_task = text.rsplit("## TASK", 1)[-1]
          queued = bool(re.search(r"(?im)^status:\s*(queued|ready|open|run)\s*$", latest_task))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"queued={str(queued).lower()}\n")
          PY
      - name: Call Meta Model API
        if: steps.pending.outputs.queued == 'true'
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
        run: python3 scripts/meta_senses.py
      - name: Commit Meta result
        if: steps.pending.outputs.queued == 'true'
        run: |
          git config user.name "meta-senses-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/from-meta.md messages/inbox-meta.md messages/user-action-required.md
          git diff --cached --quiet && exit 0
          git commit -m "meta-senses: desk reply"
          git push
