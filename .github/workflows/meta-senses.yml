name: meta-senses

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - messages/inbox-meta.md

concurrency:
  group: meta-senses
  cancel-in-progress: false

jobs:
  run-meta:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check queued
        id: pending
        run: |
          python3 -c 'from pathlib import Path; import os; t=Path("messages/inbox-meta.md").read_text(encoding="utf-8") if Path("messages/inbox-meta.md").exists() else ""; q=any(s in t.lower() for s in ("status: queued","status: ready","status: open","status: run")); open(os.environ["GITHUB_OUTPUT"],"a").write("queued="+str(q).lower()+"\n")'
      - name: Call Meta Model API
        if: steps.pending.outputs.queued == 'true'
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
        run: python3 scripts/meta_senses.py
      - name: Commit Meta result
        if: steps.pending.outputs.queued == 'true'
        run: |
          git config user.name "meta-senses-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/from-meta.md messages/inbox-meta.md messages/user-action-required.md
          git diff --cached --quiet && exit 0
          git commit -m "meta-senses: desk reply"
          git push
