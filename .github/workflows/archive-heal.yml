name: archive-heal

# Append-only mesaj arşivlerini (messages/grok-to-chatgpt.md, messages/team-reports.md)
# SEE_FILE / PLACEHOLDER / $(cat ...) ile ezildiğinde git geçmişinden onarır.
# Yalnız bu iki dosya + knowledge/lessons.md (tek seferlik notlar) yazılır; publish/ödeme yok.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - messages/grok-to-chatgpt.md
      - messages/team-reports.md
      - scripts/archive_heal.py
      - config/archive_heal_notes.json
      - .github/workflows/archive-heal.yml

concurrency:
  group: repo-main-writers
  queue: max

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate archive-heal notes (fail-closed)
        run: python3 -m json.tool config/archive_heal_notes.json > /dev/null
      - name: Reject non-main workflow dispatch before archive writes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "archive-heal: refusing non-main ref ${GITHUB_REF:-unset}" >&2
            exit 1
          fi
      - name: Heal archives from git history (fail-closed)
        run: python3 scripts/archive_heal.py
      - name: Guard (no SEE_FILE / $(cat lines)
        run: python3 scripts/archive_heal.py --check
      - name: Commit healed archives only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "archive-heal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Ephemeral Actions checkout: recompute repair on fresh main, never rebase archives.
            if ! git fetch origin main; then sleep "$attempt"; continue; fi
            git reset --hard origin/main
            python3 -m json.tool config/archive_heal_notes.json > /dev/null || exit 1
            python3 scripts/archive_heal.py || exit 1
            python3 scripts/archive_heal.py --check || exit 1
            git add -- messages/grok-to-chatgpt.md messages/team-reports.md knowledge/lessons.md
            if git diff --cached --name-only | grep -vE '^(messages/grok-to-chatgpt\.md|messages/team-reports\.md|knowledge/lessons\.md)$'; then
              echo 'unexpected staged path'; exit 1
            fi
            # A no-op on a stale snapshot is not proof that remote main is healthy.
            if git diff --cached --quiet; then
              if git fetch origin main && [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
                exit 0
              fi
              echo "archive-heal: no-op remote changed; retry from fresh main" >&2
              sleep "$attempt"
              continue
            fi
            git diff --cached --stat
            git commit -m "archive-heal: append-only mesaj arşivleri geçmişten onarıldı"
            if git push origin HEAD:main; then
              # A successful push is not enough: read the remote ref back.
              # If a concurrent writer advanced main, retry from fresh main.
              if git fetch origin main && [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
                exit 0
              fi
              echo "archive-heal: remote read-back mismatch; retry from fresh main" >&2
            fi
            sleep "$attempt"
          done
          echo "archive-heal push failed after 3 attempts" >&2
          exit 1
