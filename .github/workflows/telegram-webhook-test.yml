name: telegram-webhook-test
on:
  pull_request:
    paths:
      - 'integrations/telegram-webhook/**'
      - '.github/workflows/telegram-webhook-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test webhook security and failure handling
        run: node --test integrations/telegram-webhook/worker.test.mjs
