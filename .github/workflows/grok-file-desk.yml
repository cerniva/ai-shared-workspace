name: grok-file-desk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - messages/chatgpt-to-grok.md

concurrency:
  group: grok-file-desk
  cancel-in-progress: false

jobs:
  reply:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: grok-4.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Process latest unanswered task
        run: python3 scripts/grok_senses.py
      - name: Commit reply
        if: success()
        run: |
          git config user.name "grok-file-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/grok-to-chatgpt.md
          git diff --cached --quiet && exit 0
          git commit -m "grok: file-desk reply"
          git push
