name: gemini-senses

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - messages/inbox-gemini.md
      - messages/chatgpt-to-gemini.md
      - scripts/route_gemini_inbox.py

concurrency:
  group: gemini-senses
  cancel-in-progress: false

jobs:
  run-gemini:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route chatgpt-to-gemini into inbox
        run: python3 scripts/route_gemini_inbox.py

      - name: Check pending task
        id: pending
        run: |
          python3 -c 'from pathlib import Path; import os,re; text = Path("messages/inbox-gemini.md").read_text(); tasks = re.split(r"(?m)^## TASK[ \t]*$", text)[1:]; active = re.compile(r"(?mi)^[ \t]*status[ \t]*:[ \t]*(queued|ready|open|run)[ \t]*$"); queued = any(active.search(task) for task in tasks); open(os.environ["GITHUB_OUTPUT"], "a").write("queued=" + str(queued).lower() + "\n")'

      - name: Setup Python
        if: steps.pending.outputs.queued == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Enrich connector context
        if: steps.pending.outputs.queued == 'true'
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: python3 scripts/enrich_context.py

      - name: Call Gemini API
        if: steps.pending.outputs.queued == 'true'
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python3 scripts/gemini_senses.py

      - name: Commit Gemini result
        if: steps.pending.outputs.queued == 'true'
        run: |
          git config user.name "gemini-senses-bot"
          git config user.email "gemini-senses@users.noreply.github.com"
          git add messages/gemini-to-chatgpt.md messages/inbox-gemini.md messages/user-action-required.md research/youtube/
          git diff --cached --quiet && exit 0
          git commit -m "Gemini senses reply"
          git pull --rebase origin main
          git push origin main
