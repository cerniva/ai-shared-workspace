name: gemini-senses

on:
  workflow_dispatch:
  push:
    paths:
      - messages/inbox-gemini.md
    branches: [main]

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Call Gemini and append reply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/gemini_senses.py
      - name: Commit reply
        run: |
          git config user.name "gemini-senses-bot"
          git config user.email "gemini-senses@users.noreply.github.com"
          git add messages/gemini-to-chatgpt.md messages/inbox-gemini.md
          git diff --cached --quiet || git commit -m "Gemini senses reply"
          git push
