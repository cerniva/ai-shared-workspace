name: core05-catalog-repair

on:
  push:
    branches: [fix/core05-verification-debt]
    paths:
      - 'scripts/repair_source_catalog_ids.py'
      - '.github/workflows/core05-catalog-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair stable source IDs
        run: python3 -m scripts.repair_source_catalog_ids
      - name: Validate catalog
        run: python3 -m scripts.knowledge_bridge validate
      - name: Persist repaired catalog
        shell: bash
        run: |
          if git diff --quiet -- knowledge/source_catalog.json; then
            exit 0
          fi
          git config user.name "ai-worker-bot"
          git config user.email "ai-worker-bot@users.noreply.github.com"
          git add knowledge/source_catalog.json
          git commit -m "fix: normalize source catalog stable IDs"
          git push origin HEAD:fix/core05-verification-debt
