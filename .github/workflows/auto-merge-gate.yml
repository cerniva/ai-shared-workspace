name: auto-merge-gate

# Merges with GITHUB_TOKEN do NOT trigger push workflows on main.
# Downstream (ders botu / bekçi / denetçi) must listen to:
#   on: repository_dispatch: types: [main-merged]
#   client_payload: {pr_number, merge_sha, handoff_id}

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened, ready_for_review, edited]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["worker-orchestration-tests", "handoff-audit", "takipci-denetci", "codeql"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (empty = all open PRs)"
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-gate
  cancel-in-progress: false

jobs:
  auto-merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Evaluate and merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: python3 scripts/auto_merge_gate.py
